<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops | TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #182230;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .error-box {
            width: min(650px, 100%);
            text-align: center;
            background: white;
            border: 1px solid #e4e8ef;
            border-radius: 22px;
            padding: 55px 35px;
            box-shadow: 0 18px 50px rgba(20, 30, 50, 0.07);
        }

        .number {
            font-size: 110px;
            line-height: 1;
            font-weight: 800;
            color: #536dfe;
            letter-spacing: -8px;
            margin-bottom: 15px;
        }

        .line {
            width: 55px;
            height: 4px;
            background: #536dfe;
            border-radius: 10px;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #667085;
            line-height: 1.6;
            max-width: 470px;
            margin: auto;
        }

        .path {
            display: inline-block;
            margin-top: 22px;
            padding: 9px 13px;
            border-radius: 8px;
            background: #f1f3f8;
            color: #667085;
            font-family: monospace;
            font-size: 13px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .home {
            background: #536dfe;
            color: white;
        }

        .back {
            background: white;
            color: #344054;
            border: 1px solid #d9dee8;
        }

        .brand {
            margin-top: 38px;
            color: #8a93a3;
            font-size: 13px;
        }

        .brand span {
            color: #536dfe;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <main class="error-box">

        <div class="number">
            404
        </div>

        <div class="line"></div>

        <h1>
            This task got lost.
        </h1>

        <p>
            The page you're looking for doesn't exist here.
            Maybe the task was deleted, the URL is wrong,
            or you took a wrong turn.
        </p>

        <div class="path">
            /page-not-found
        </div>

        <div class="buttons">

            <a href="/" class="home">
                Back to Home
            </a>

            <a href="/tasks.html" class="back">
                View Tasks
            </a>

        </div>

        <div class="brand">
            <span>TaskFlow</span> · Keep moving forward.
        </div>

    </main>

</body>
</html>
